</style></head><body><h1>본문 표·그림 초안 (그림 1–2, 표 1–6)</h1><p class='sub'>보고서 구성안 기준 · 수치는 output/Team_result.RData의 res$paper에서 자동 생성 · 2026-11-24</p><figure class='fig'><figcaption>그림 1. 자료의 시점 정렬</figcaption><img src='../figures/paper_figure1_timing.svg'><p class='note'>조건은 충격보다 먼저 알려진 값(한국 t일 마감)만 쓴다. 따라서 회귀의 어떤 설명변수도 목표 Δy(t+1)보다 뒤의 정보를 담지 않는다. 미국 휴장일은 그날 변화가 0으로 들어가고, 결측은 보간하지 않는다. (b)는 02_analysis.R가 stopifnot으로 확인하는 정렬 사례다.<br><span class='src'>출처: paper_figure1_timing.svg (05_paper_tables.R가 생성)</span></p></figure><figure class='tbl'><figcaption>표 1. 기술통계 (2010-01-04 ~ 2026-10-30, 한국 거래일 쌍)</figcaption><table><tr><th>변수</th><th>N</th><th>평균</th><th>표준편차</th><th>최소</th><th>중앙값</th><th>최대</th></tr><tr><td>국고채 3년 일별 변화 Δy (bp)</td><td>4,140</td><td>-0.018</td><td>3.859</td><td>-26.80</td><td>0.00</td><td>34.90</td></tr><tr><td>국고채 10년 일별 변화 Δy (bp)</td><td>4,140</td><td>-0.034</td><td>4.093</td><td>-22.00</td><td>0.00</td><td>32.10</td></tr><tr><td>미 2년 충격 s (bp)</td><td>4,140</td><td>0.084</td><td>4.603</td><td>-57.00</td><td>0.00</td><td>34.00</td></tr><tr><td>미 10년 충격 s (bp)</td><td>4,140</td><td>0.027</td><td>5.401</td><td>-30.00</td><td>0.00</td><td>29.00</td></tr><tr><td>|국고채 1년 − 기준금리| (%p)</td><td>4,140</td><td>0.264</td><td>0.241</td><td>0.00</td><td>0.20</td><td>1.50</td></tr><tr><td>외국인 3년 선물 누적 순매수 (250일 z)</td><td>4,140</td><td>0.109</td><td>1.334</td><td>-3.28</td><td>0.32</td><td>3.28</td></tr><tr><td>log VIX</td><td>4,140</td><td>2.859</td><td>0.310</td><td>2.21</td><td>2.82</td><td>4.42</td></tr><tr><td>통화정책형 날 비율 mon = 1 (3년물 짝)</td><td></td><td>44.0%</td><td></td><td></td><td></td><td></td></tr><tr><td>통화정책형 날 비율 mon = 1 (10년물 짝)</td><td></td><td>43.3%</td><td></td><td></td><td></td><td></td></tr><tr><td>단기 주도 날 비율 FLAT = 1 (3년물 짝)</td><td></td><td>37.2%</td><td></td><td></td><td></td><td></td></tr><tr><td>단기 주도 날 비율 FLAT = 1 (10년물 짝)</td><td></td><td>26.2%</td><td></td><td></td><td></td><td></td></tr></table><p class='note'>Δy는 한국 t일 종가 → t+1일 종가 변화, s는 그사이 끝난 미국 거래일 변화의 합이다. 조건은 한국 t일 마감 때 알려진 값이다. 비율은 s ≠ 0인 날 기준이다.<br><span class='src'>출처: paper_table1.csv</span></p></figure><figure class='tbl'><figcaption>표 2. 기준 전이: 미국 금리 충격의 다음 날 국고채 전이</figcaption><table><tr><th class='grp' colspan='1'></th><th class='grp' colspan='4'>기준 모형 (1)</th><th class='grp' colspan='3'>상승·하락 분리</th><th class='grp' colspan='2'>경제적 크기</th></tr><tr><th>목표 (← 충격)</th><th>β₀ (t)</th><th>ρ (t)</th><th>R²</th><th>N</th><th>β 상승일</th><th>β 하락일</th><th>같음 p</th><th>미 10bp → bp</th><th>Δy 표준편차 (bp)</th></tr><tr><td>3년물 (← 미 2년)</td><td>0.291 (16.7)</td><td>-0.068 (-3.6)</td><td>0.123</td><td>4,140</td><td>0.294</td><td>0.288</td><td>0.911</td><td>2.9</td><td>3.9</td></tr><tr><td>10년물 (← 미 10년)</td><td>0.296 (19.2)</td><td>-0.077 (-4.4)</td><td>0.154</td><td>4,140</td><td>0.279</td><td>0.312</td><td>0.494</td><td>3.0</td><td>4.1</td></tr></table><p class='note'>식 (1): Δy(t+1) = α + β₀ s(t) + ρ Δy(t) + δ′D(t) + ε. D는 휴장·FOMC·금통위 더미. 괄호 안은 Newey–West(시차 9) t값. '같음 p'는 β 상승일 = β 하락일의 HAC Wald 검정.<br><span class='src'>출처: paper_table2.csv</span></p></figure><figure class='fig'><figcaption>그림 2. 250일 롤링 전이 계수 (점선 = 전체 표본)</figcaption><img src='../figures/figure5_rolling_beta.png'><p class='note'>그림 안의 영문 제목은 본문 작성 때 지운다.<br><span class='src'>출처: figure5_rolling_beta.png</span></p></figure><figure class='tbl'><figcaption>표 3. 사전 가설 (1부): 시장 조건에 따른 전이 차이</figcaption><table><tr><th class='grp' colspan='1'></th><th class='grp' colspan='3'>설정 A: trend 있음</th><th class='grp' colspan='3'>설정 B: trend 없음</th><th class='grp' colspan='1'></th></tr><tr><th>가설 (예측 부호 +)</th><th>계수</th><th>p</th><th>Holm p</th><th>계수</th><th>p</th><th>Holm p</th><th>판정</th></tr><tr class='sec'><td><b>3년물 (← 미 2년)</b></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>P1 기대: s × |kr1y_gap|</td><td>0.010</td><td>0.574</td><td>1.000</td><td>0.008</td><td>0.663</td><td>1.000</td><td>기각 못 함</td></tr><tr><td>P2 수급: s⁺ × fut3</td><td>-0.063</td><td>0.032</td><td>0.128</td><td>-0.058</td><td>0.053</td><td>0.210</td><td>기각 못 함</td></tr><tr><td>P3 위험: s × log VIX</td><td>-0.010</td><td>0.578</td><td>1.000</td><td>-0.007</td><td>0.670</td><td>1.000</td><td>기각 못 함</td></tr><tr class='joint'><td>결합 Wald χ²(3): 세 계수 = 0</td><td>5.64</td><td>0.131</td><td>0.131</td><td>4.45</td><td>0.217</td><td>0.217</td><td></td></tr><tr class='sec'><td><b>10년물 (← 미 10년)</b></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>P1 기대: s × |kr1y_gap|</td><td>-0.024</td><td>0.068</td><td>0.204</td><td>-0.026</td><td>0.087</td><td>0.262</td><td>기각 못 함</td></tr><tr><td>P2 수급: s⁺ × fut3</td><td><b>-0.075</b></td><td>0.004</td><td><b>0.022</b></td><td>-0.061</td><td>0.030</td><td>0.148</td><td>설정 의존</td></tr><tr><td>P3 위험: s × log VIX</td><td><b>-0.034</b></td><td>0.009</td><td><b>0.044</b></td><td><b>-0.035</b></td><td>0.003</td><td><b>0.016</b></td><td>유의 (예측과 반대 부호)</td></tr><tr class='joint'><td>결합 Wald χ²(3): 세 계수 = 0</td><td>28.01</td><td>3.6e-06</td><td>7.2e-06</td><td>26.37</td><td>8.0e-06</td><td>1.6e-05</td><td></td></tr></table><p class='note'>식 (2)의 상호작용 계수. 조건은 표준화했으므로 계수는 조건 1 표준편차당 전이 계수의 변화다. P2는 s를 상승(s⁺)·하락(s⁻)으로 나눈 식에서 s⁺ 항이다. 양측 검정, Newey–West(시차 9). Holm은 설정마다 6개 검정(가설 3 × 만기 2)에 적용한다. 굵게 = Holm p < 0.05. 판정 규칙: A·B 모두 통과하면 '유의', 하나만 통과하면 '설정 의존'. 결합 Wald 행의 계수 칸은 χ² 통계량이고, Holm은 만기 2개에 적용한다.<br><span class='src'>출처: paper_table3.csv, paper_table3_joint.csv</span></p></figure><figure class='tbl'><figcaption>표 4. 충격 성격 (3부): 미리 고정한 검정 8개</figcaption><table><tr><th class='grp' colspan='1'></th><th class='grp' colspan='1'></th><th class='grp' colspan='4'>3년물</th><th class='grp' colspan='4'>10년물</th></tr><tr><th>검정 (미리 정한 예측)</th><th>효과 지표</th><th>효과</th><th>통계량</th><th>p</th><th>Holm p</th><th>효과</th><th>통계량</th><th>p</th><th>Holm p</th></tr><tr><td>N2 s × FLAT > 0 (단측 t)</td><td>s × FLAT 계수</td><td>-0.025</td><td>-0.73</td><td>0.767</td><td>0.767</td><td>0.121</td><td>3.42</td><td>3.1e-04</td><td><b>0.002</b></td></tr><tr><td>N3 c_m > c_g (부호 붙인 LR)</td><td>c_m − c_g</td><td>0.294</td><td>0.78</td><td>0.217</td><td>0.434</td><td>1.096</td><td>2.18</td><td>0.014</td><td>0.072</td></tr><tr><td>N5 M4 vs M1 (Clark–West)</td><td>R²_OOS</td><td>0.24%</td><td>1.45</td><td>0.074</td><td>0.221</td><td>1.30%</td><td>4.38</td><td>6.0e-06</td><td><b>4.8e-05</b></td></tr><tr><td>N7 M4 vs M2 (GW 무조건부, 단측)</td><td>R²_OOS</td><td>1.82%</td><td>1.70</td><td>0.045</td><td>0.179</td><td>1.56%</td><td>2.34</td><td>0.010</td><td>0.058</td></tr></table><p class='note'>mon = 1은 미국 금리 변화와 같은 날 NASDAQ 수익률의 부호가 반대인 날(통화정책형, Hoek, Kamin & Yoldas 2022의 일별 근사), FLAT = 1은 |Δ미 2년| > |Δ미 10년|인 날이다. N3는 GARCH(1,1)-X 분산식에 s²·mon과 s²·(1 − mon)을 넣은 모형(Student-t). N5·N7의 R²_OOS = 1 − MSFE(M4)/MSFE(비교 모형), 1,000일 롤링. M1 = 기준, M2 = M1 + 조건 3개, M4 = M1 + mon. Holm은 8개 검정(4 × 만기 2)에 함께 적용한다. 굵게 = Holm p < 0.05. N3의 성격별 c: 10년물 c_m 1.77 (0.67), c_g 0.67 (0.40); 3년물 c_m 0.46, c_g 0.17. 1부(설정 A) 6개와 합친 14개 Holm에서도 10년물 N2(0.004)와 N5(8.4e-05)는 통과한다.<br><span class='src'>출처: paper_table4.csv, paper_table4_n3.csv</span></p></figure><figure class='tbl'><figcaption>표 5. 경제적 크기</figcaption><table><tr><th>미국 금리 10bp 충격일 때 다음 날 국고채 변화 (bp)</th><th>3년물</th><th>10년물</th></tr><tr><td>기준 전이 (미 10bp 충격)</td><td>2.91</td><td>2.96</td></tr><tr><td>성장형 날 (mon = 0)</td><td>2.43</td><td>2.38</td></tr><tr><td>통화정책형 날 (mon = 1)</td><td>3.44</td><td>3.81</td></tr><tr><td>P1 |kr1y_gap| +1 표준편차일 때 변화</td><td>0.10</td><td>-0.24</td></tr><tr><td>P2 외국인 선물 +1 표준편차일 때 변화 (미 금리 상승일)</td><td>-0.63</td><td>-0.75</td></tr><tr><td>P3 log VIX +1 표준편차일 때 변화</td><td>-0.10</td><td>-0.34</td></tr><tr class='ref'><td>참고: 국고채 일별 변화의 표준편차</td><td>3.86</td><td>4.09</td></tr></table><p class='note'>기준 전이 = 10 × β₀(표 2). 성장형·통화정책형 = 10 × 각 날의 전이 계수(s × mon을 넣은 식 N1. 효과를 본 뒤 정한 식이라 확증 검정에는 쓰지 않는다). 조건 행 = 10 × 상호작용 계수(설정 A, 표 3). 조건 효과와 성격 효과의 크기 비교는 검정이 아니다(직접 비교 N7은 표 4).<br><span class='src'>출처: paper_table5.csv</span></p></figure><figur
