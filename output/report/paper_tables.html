</style></head><body><h1>본문 표·그림 초안 (그림 1–2, 표 1–6)</h1><p class='sub'>보고서 구성안 기준 · 수치는 output/Team_result.RData의 res$paper에서 자동 생성 · 2026-11-25</p><figure class='fig'><figcaption>그림 1. 자료의 시점 정렬</figcaption><img src='../figures/paper_figure1_timing.svg'><p class='note'>조건은 한국 t일 마감 때 알려진 값만 쓴다. 미국 금리는 뉴욕 오후 3시 30분 무렵 값이어서, (a)의 미국 장 변화 중 아시아 시간대 앞부분은 한국 t일 장중과 겹친다(3.2절, 표 2의 같은 날 점검). 미국 휴장일은 그날 변화가 0으로 들어가고, 결측은 보간하지 않는다. (b)는 02_analysis.R가 stopifnot으로 확인하는 정렬 사례다.<br><span class='src'>출처: paper_figure1_timing.svg (05_paper_tables.R가 생성)</span></p></figure><figure class='tbl'><figcaption>표 1. 기술통계 (2010-01-04 ~ 2026-10-30, 한국 거래일 쌍)</figcaption><table><tr><th>변수</th><th>N</th><th>평균</th><th>표준편차</th><th>최소</th><th>중앙값</th><th>최대</th><th>첨도</th></tr><tr><td>국고채 3년 일별 변화 Δy (bp)</td><td>4,140</td><td>-0.018</td><td>3.859</td><td>-26.80</td><td>0.00</td><td>34.90</td><td>11.1</td></tr><tr><td>국고채 10년 일별 변화 Δy (bp)</td><td>4,140</td><td>-0.034</td><td>4.093</td><td>-22.00</td><td>0.00</td><td>32.10</td><td>6.5</td></tr><tr><td>미 2년 충격 s (bp)</td><td>4,140</td><td>0.084</td><td>4.603</td><td>-57.00</td><td>0.00</td><td>34.00</td><td>15.3</td></tr><tr><td>미 10년 충격 s (bp)</td><td>4,140</td><td>0.027</td><td>5.401</td><td>-30.00</td><td>0.00</td><td>29.00</td><td>5.0</td></tr><tr><td>|국고채 1년 − 기준금리| (%p)</td><td>4,140</td><td>0.264</td><td>0.241</td><td>0.00</td><td>0.20</td><td>1.50</td><td>5.9</td></tr><tr><td>외국인 3년 선물 누적 순매수 (250일 z)</td><td>4,140</td><td>0.109</td><td>1.334</td><td>-3.28</td><td>0.32</td><td>3.28</td><td>2.3</td></tr><tr><td>log VIX</td><td>4,140</td><td>2.859</td><td>0.310</td><td>2.21</td><td>2.82</td><td>4.42</td><td>4.0</td></tr><tr><td>통화정책형 날 비율 mon = 1 (3년물 짝)</td><td></td><td>44.0%</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>통화정책형 날 비율 mon = 1 (10년물 짝)</td><td></td><td>43.3%</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>단기 주도 날 비율 FLAT = 1 (3년물 짝)</td><td></td><td>37.2%</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>단기 주도 날 비율 FLAT = 1 (10년물 짝)</td><td></td><td>26.2%</td><td></td><td></td><td></td><td></td><td></td></tr></table><p class='note'>Δy는 한국 t일 종가 → t+1일 종가 변화, s는 그사이 끝난 미국 거래일 변화의 합이다. 조건은 한국 t일 마감 때 알려진 값이다. 비율은 s ≠ 0인 날 기준이다. 첨도는 정규분포에서 3이다.<br><span class='src'>출처: paper_table1.csv, table1_descriptive.csv(첨도)</span></p></figure><figure class='tbl'><figcaption>표 2. 기준 전이: 미국 금리 충격의 다음 날 국고채 전이</figcaption><table><tr><th class='grp' colspan='1'></th><th class='grp' colspan='4'>기준 모형 (1)</th><th class='grp' colspan='3'>상승·하락 분리</th><th class='grp' colspan='2'>경제적 크기</th><th class='grp' colspan='1'>같은 날</th></tr><tr><th>목표</th><th>β₀ (t)</th><th>ρ (t)</th><th>R²</th><th>N</th><th>β⁺</th><th>β⁻</th><th>같음 p</th><th>10bp → bp</th><th>Δy s.d.</th><th>Δy(t) 계수 (t)</th></tr><tr><td>3년물</td><td>0.291 (16.7)</td><td>-0.068 (-3.6)</td><td>0.123</td><td>4,140</td><td>0.294</td><td>0.288</td><td>0.911</td><td>2.9</td><td>3.9</td><td>0.101 (4.9)</td></tr><tr><td>10년물</td><td>0.296 (19.2)</td><td>-0.077 (-4.4)</td><td>0.154</td><td>4,140</td><td>0.279</td><td>0.312</td><td>0.494</td><td>3.0</td><td>4.1</td><td>0.121 (8.2)</td></tr></table><p class='note'>식 (1): Δy(t+1) = α + β₀ s(t) + ρ Δy(t) + δ′D(t) + ε. 3년물은 미 2년, 10년물은 미 10년 충격. D는 휴장·FOMC·금통위 더미. 괄호 안은 Newey–West(시차 9) t값. β⁺·β⁻는 상승·하락 충격의 계수, Δy s.d.는 국고채 일별 변화의 표준편차(bp). '같음 p'는 β⁺ = β⁻의 HAC Wald 검정. '같은 날'은 한국 t일 변화 Δy(t)를 s(t)에 회귀한 계수다. 미국 금리는 뉴욕 오후 3시 30분 무렵 값이라 s(t)의 일부는 한국 t일 장중에 일어난다(3.2절).<br><span class='src'>출처: paper_table2.csv</span></p></figure><figure class='fig'><figcaption>그림 2. 250일 롤링 전이 계수</figcaption><img src='../figures/paper_figure2_rolling.svg'><p class='note'>각 날짜의 값은 그날까지 250거래일 창에서 Δy(t+1)를 s(t)에 단순 회귀한 계수다. 점선은 식 (1)의 전체 표본 β₀(3년물 0.29, 10년물 0.30)다.<br><span class='src'>출처: res$rolling_beta (figure5_rolling_beta.png와 같은 계열)</span></p></figure><figure class='tbl'><figcaption>표 3. 사전 가설 (1부): 시장 조건에 따른 전이 차이</figcaption><table><tr><th class='grp' colspan='1'></th><th class='grp' colspan='3'>설정 A: trend 있음</th><th class='grp' colspan='3'>설정 B: trend 없음</th><th class='grp' colspan='1'></th></tr><tr><th>가설 (예측 부호 +)</th><th>계수</th><th>p</th><th>Holm p</th><th>계수</th><th>p</th><th>Holm p</th><th>판정</th></tr><tr class='sec'><td><b>3년물 (← 미 2년)</b></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>P1 기대: s × |kr1y_gap|</td><td>0.010</td><td>0.574</td><td>1.000</td><td>0.008</td><td>0.663</td><td>1.000</td><td>기각 못 함</td></tr><tr><td>P2 수급: s⁺ × fut3</td><td>-0.063</td><td>0.032</td><td>0.128</td><td>-0.058</td><td>0.053</td><td>0.210</td><td>기각 못 함</td></tr><tr><td>P3 위험: s × log VIX</td><td>-0.010</td><td>0.578</td><td>1.000</td><td>-0.007</td><td>0.670</td><td>1.000</td><td>기각 못 함</td></tr><tr class='joint'><td>결합 Wald χ²(3): 세 계수 = 0</td><td>5.64</td><td>0.131</td><td>0.131</td><td>4.45</td><td>0.217</td><td>0.217</td><td></td></tr><tr class='sec'><td><b>10년물 (← 미 10년)</b></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>P1 기대: s × |kr1y_gap|</td><td>-0.024</td><td>0.068</td><td>0.204</td><td>-0.026</td><td>0.087</td><td>0.262</td><td>기각 못 함</td></tr><tr><td>P2 수급: s⁺ × fut3</td><td><b>-0.075</b></td><td>0.004</td><td><b>0.022</b></td><td>-0.061</td><td>0.030</td><td>0.148</td><td>설정 의존</td></tr><tr><td>P3 위험: s × log VIX</td><td><b>-0.034</b></td><td>0.009</td><td><b>0.044</b></td><td><b>-0.035</b></td><td>0.003</td><td><b>0.016</b></td><td>유의 (예측과 반대 부호)</td></tr><tr class='joint'><td>결합 Wald χ²(3): 세 계수 = 0</td><td>28.01</td><td>3.6e-06</td><td>7.2e-06</td><td>26.37</td><td>8.0e-06</td><td>1.6e-05</td><td></td></tr></table><p class='note'>식 (2)의 상호작용 계수. 조건은 표준화했으므로 계수는 조건 1 표준편차당 전이 계수의 변화다. P2는 s를 상승(s⁺)·하락(s⁻)으로 나눈 식에서 s⁺ 항이다. 양측 검정, Newey–West(시차 9). Holm은 설정마다 6개 검정(가설 3 × 만기 2)에 적용한다. 굵게 = Holm p < 0.05. 판정 규칙: A·B 모두 통과하면 '유의', 하나만 통과하면 '설정 의존'. 결합 Wald 행의 계수 칸은 χ² 통계량이고, Holm은 만기 2개에 적용한다.<br><span class='src'>출처: paper_table3.csv, paper_table3_joint.csv</span></p></figure><figure class='tbl'><figcaption>표 4. 충격 성격 (3부): 미리 고정한 검정 8개</figcaption><table><tr><th class='grp' colspan='1'></th><th class='grp' colspan='1'></th><th class='grp' colspan='4'>3년물</th><th class='grp' colspan='4'>10년물</th></tr><tr><th>검정 (미리 정한 예측)</th><th>효과 지표</th><th>효과</th><th>통계량</th><th>p</th><th>Holm p</th><th>효과</th><th>통계량</th><th>p</th><th>Holm p</th></tr><tr><td>N2 s × FLAT > 0 (단측 t)</td><td>s × FLAT 계수</td><td>-0.025</td><td>-0.73</td><td>0.767</td><td>0.767</td><td>0.121</td><td>3.42</td><td>3.1e-04</td><td><b>0.002</b></td></tr><tr><td>N3 c_m > c_g (부호 붙인 LR)</td><td>c_m − c_g</td><td>0.294</td><td>0.78</td><td>0.217</td><td>0.434</td><td>1.096</td><td>2.18</td><td>0.014</td><td>0.072</td></tr><tr><td>N5 M4 vs M1 (Clark–West)</td><td>R²_OOS</td><td>0.24%</td><td>1.45</td><td>0.074</td><td>0.221</td><td>1.30%</td><td>4.38</td><td>6.0e-06</td><td><b>4.8e-05</b></td></tr><tr><td>N7 M4 vs M2 (GW 무조건부, 단측)</td><td>R²_OOS</td><td>1.82%</td><td>1.70</td><td>0.045</td><td>0.179</td><td>1.56%</td><td>2.34</td><td>0.010</td><td>0.058</td></tr></table><p class='note'>mon = 1은 미국 금리 변화와 같은 날 NASDAQ 수익률의 부호가 반대인 날(통화정책형, Hoek, Kamin & Yoldas 2022의 일별 근사), FLAT = 1은 |Δ미 2년| > |Δ미 10년|인 날이다. N3는 GARCH(1,1)-X 분산식에 s²·mon과 s²·(1 − mon)을 넣은 모형(Student-t). N5·N7의 R²_OOS = 1 − MSFE(M4)/MSFE(비교 모형), 1,000일 롤링. M1 = 기준, M2 = M1 + 조건 3개, M4 = M1 + mon. Holm은 8개 검정(4 × 만기 2)에 함께 적용한다. 굵게 = Holm p < 0.05. N3의 성격별 c: 10년물 c_m 1.77 (0.67), c_g 0.67 (0.40); 3년물 c_m 0.46, c_g 0.17. 1부(설정 A) 6개와 합친 14개 Holm에서도 10년물 N2(0.004)와 N5(8.4e-05)는 통과한다.<br><span class='src'>출처: paper_table4.csv, paper_table4_n3.csv</span></p></figure><figure class='tbl'><figcaption>표 5. 경제적 크기</figcaption><table><tr><th>미국 금리 10bp 충격일 때 다음 날 국고채 변화 (bp)</th><th>3년물</th><th>10년물</th></tr><tr><td>기준 전이 (미 10bp 충격)</td><td>2.91</td><td>2.96</td></tr><tr><td>성장형 날 (mon = 0)</td><td>2.43</td><td>2.38</td></tr><tr><td>통화정책형 날 (mon = 1)</td><td>3.44</td><td>3.81</td></tr><tr><td>P1 |kr1y_gap| +1 표준편차일 때 변화</td><td>0.10</td><td>-0.24</td></tr><tr><td>P2 외국인 선물 +1 표준편차일 때 변화 (미 금리 상승일)</td><td>-0.63</td><td>-0.75</td></tr><tr><td>P3 log VIX +1 표준편차일 때 변화</td><td>-0.10</td><td>-0.34</td></tr><tr class='ref'><td>참고: 국고채 일별 변화의 표준편차</td><td>3.86</td><td>4.09</td></tr></table><p class='note'>기준 전이 = 10 × β₀(표 2). 성장형·통화정책형 = 10 × 각 날의 전이 계수(s × mon을 넣은 식 N1. 효과를 본 뒤 정한 식이라 확증 검정에는 쓰지 않는다). 조건 행 = 10 × 상호작용 계수(설정 A, 표 3). 조건 효과와 성격 효과의 크기 비교는 검정이 아니다(직접 비교 N7은 표 4).<br><span class='src'>출처: paper_table5.csv</span></p></figure><figure class='tbl'><figcaption>표 6. 견고성: 10년물 두 결과</figcaption><table><tr><th class='grp' colspan='1'></th><th class='grp' colspan='2'>P3: s × log VIX</th><th class='grp' colspan='2'>P2: s⁺ × fut3</th><th class='grp' colspan='2'>참고: s × fut3 (대칭)</th></tr><tr><th>설정 (10년물)</th><th>계수</th><th>p (Holm)</th><th>계수</th><th>p (Holm)</th><th>계수</th><th>p</th></tr><tr class='main'><td>본 설정 A (trend)</td><td>-0.034</td><td>0.009 (<b>0.044</b>)</td><td>-0.075</td><td>0.004 (<b>0.022</b>)</td><td>–</td><td>–</td></tr><tr><td>설정 B (trend 없음)</td><td>-0.035</td><td>0.003 (<b>0.016</b>)</td><td>-0.061</td><td>0.030 (0.148)</td><td>–</td><td>–</td></tr><tr><td>설정 C (A + mon 통제)</td><td>-0.029</td><td>0.020 (0.100)</td><td>-0.070</td><td>0.006 (<b>0.034</b>)</td><td>–</td><td>–</td></tr><tr><td>설정 D (B + mon 통제)</td><td>-0.028</td><td>0.015 (0.092)</td><td>-0.057</td><td>0.032 (0.128)</td><td>–</td><td>–</td></tr><tr><td>R1 충격을 미 2년으로</td><td>-0.037</td><td>0.033</td><td>–</td><td>–</td><td>-0.030</td><td>0.063</td></tr><tr><td>R1 충격을 미 3년으로</td><td>-0.039</td><td>0.014</td><td>–</td><td>–</td><td>-0.024</td><td>0.114</td></tr><tr><td>R1 충격을 미 5년으로</td><td>-0.030</td><td>0.050</td><td>–</td><td>–</td><td>-0.020</td><td>0.136</td></tr><tr><td>R3 FOMC ±3일 제외</td><td>-0.056</td><td>0.027</td><td>–</td><td>–</td><td>-0.007</td><td>0.692</td></tr><tr><td>R4 2010–2019 (trend 없음)</td><td>-0.021</td><td>0.226</td><td>–</td><td>–</td><td>-0.028</td><td>0.121</td></tr><tr><td> '>10년물</th></tr><tr><th>(a) 미리 정한 검정 (Holm 8개)</th><th>효과</th><th>통계량</th><th>p</th><th>Holm p</th><th>효과</th><th>통계량</th><th>p</th><th>Holm p</th></tr><tr><td>V1 d(log VIX) > 0 (LR, χ̄²)</td><td>0.000</td><td>0.00</td><td>0.500</td><td>1.000</td><td>0.000</td><td>0.00</td><td>0.500</td><td>1.000</td></tr><tr><td>V2 c_hi = c_lo (LR, 양측)</td><td>-0.190</td><td>0.58</td><td>0.446</td><td>1.000</td><td>-0.073</td><td>0.06</td><td>0.804</td><td>1.000</td></tr><tr><td>V3 G1 vs G0: 미국 충격 (QLIKE, DMW)</td><td>-0.06%</td><td>-0.16</td><td>0.565</td><td>1.000</td><td>0.26%</td><td>0.44</td><td>0.330</td><td>1.000</td></tr><tr><td>V4 G2 vs G1: + log VIX (QLIKE, DMW)</td><td>-0.03%</td><td>-0.72</td><td>0.765</td><td>1.000</td><td>-0.10%</td><td>-1.48</td><td>0.930</td><td>1.000</td></tr><tr class='sec'><td colspan='9'><b>(b) V1 모형의 분산식 계수 (괄호: robust 표준오차)</b></td></tr><tr><td>α (ARCH)</td><td>0.084<br><span class='se'>(0.016)</span></td><td></td><td></td><td></td><td>0.081<br><span class='se'>(0.010)</span></td><td></td><td></td><td></td></tr><tr><td>β (GARCH)</td><td>0.910<br><span class='se'>(0.018)</span></td><td></td><td></td><td></td><td>0.889<br><span class='se'>(0.017)</span></td><td></td><td></td><td></td></tr><tr><td>c (미국 충격² / 100)</td><td>0.278<br><span class='se'>(0.209)</span></td><td></td><td></td><td></td><td>0.987<br><span class='se'>(0.400)</span></td><td></td><td></td><td></td></tr><tr><td>d (log VIX)</td><td>0.000<br><span class='se'>(0.061)</span></td><td></td><td></td><td></td><td>0.000<br><span class='se'>(0.082)</span></td><td></td><td></td><td></td></tr></table><p class='note'>분산식 h(t+1) = ω + α ε(t)² + β h(t) + c·s(t)²/100 + d·log VIX(t). V1은 d = 0을 c만 있는 GARCH-X와 비교하는 우도비 검정이며 d ≥ 0 제약 때문에 χ̄²(50:50)를 쓴다. V2는 c를 VIX가 중앙값보다 높은 날(c_hi)과 낮은 날(c_lo)로 나눈다(평균식에 HV, s × HV 포함). 효과 = c_hi − c_lo. V3·V4는 1,000일 롤링 창(20일마다 재추정)의 1일 앞 분산 예측 3,140개를 M1 예측오차 제곱(하한 0.01)에 대해 QLIKE로 비교한 DMW 단측 검정이다. 효과 = 상대 QLIKE 개선(양수 = 큰 모형이 나음). 설계는 결과 전에 커밋했다(docs/조건별전이_4부_변동
