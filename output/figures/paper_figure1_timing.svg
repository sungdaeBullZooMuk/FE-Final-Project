<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 505' font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id='ar' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#5b5a55'/></marker></defs><rect width='1000' height='505' fill='#ffffff'/><text x='20' y='26' text-anchor='start' font-size='20' font-weight='700' fill='#141413'>(a) 보통의 하루</text><text x='40' y='62' text-anchor='start' font-size='19' font-weight='700' fill='#141413'>조건 z(t) 확정 (한국 t일 마감)</text><text x='40' y='85' text-anchor='start' font-size='16.5' font-weight='400' fill='#5b5a55'>|kr1y_gap|, 외국인 선물 포지션, log VIX</text><line x1='250' y1='94' x2='250' y2='122' stroke='#5b5a55' stroke-width='1.2' stroke-dasharray='4 3'/><text x='620' y='62' text-anchor='middle' font-size='19' font-weight='700' fill='#141413'>충격 s(t) = 미국 금리 변화 (bp)</text><text x='620' y='85' text-anchor='middle' font-size='16.5' font-weight='400' fill='#5b5a55'>같은 밤 주가 방향 → mon(t), 곡선 모양 → FLAT(t)</text><line x1='30' y1='184' x2='975' y2='184' stroke='#141413' stroke-width='1.5' marker-end='url(#ar)'/><rect x='40' y='124' width='210' height='60' rx='5' fill='#eef4fc' stroke='#2a78d6' stroke-width='1.2'/><text x='145' y='150' text-anchor='middle' font-size='19' font-weight='700' fill='#2a78d6'>한국 t일 마감</text><text x='145' y='173' text-anchor='middle' font-size='16.5' font-weight='400' fill='#2a78d6'>종가 y(t)</text><rect x='400' y='124' width='280' height='60' rx='5' fill='#fdf1eb' stroke='#eb6834' stroke-width='1.2'/><text x='540' y='150' text-anchor='middle' font-size='19' font-weight='700' fill='#eb6834'>미국 t일 장</text><text x='540' y='173' text-anchor='middle' font-size='16.5' font-weight='400' fill='#eb6834'>한국 시간으로 밤</text><rect x='760' y='124' width='200' height='60' rx='5' fill='#eef4fc' stroke='#2a78d6' stroke-width='1.2'/><text x='860' y='150' text-anchor='middle' font-size='19' font-weight='700' fill='#2a78d6'>한국 t+1일 마감</text><text x='860' y='173' text-anchor='middle' font-size='16.5' font-weight='400' fill='#2a78d6'>종가 y(t+1)</text><path d='M145,192 L145,204 L860,204 L860,192' fill='none' stroke='#141413' stroke-width='1.4'/><text x='500' y='234' text-anchor='middle' font-size='19' font-weight='700' fill='#141413'>목표 Δy(t+1) = y(t+1) − y(t) (bp)</text><line x1='20' y1='258' x2='980' y2='258' stroke='#d9d8d2' stroke-width='1'/><text x='20' y='292' text-anchor='start' font-size='20' font-weight='700' fill='#141413'>(b) 한국 휴장이 낀 실제 사례: 2026년 9/23 → 9/28</text><text x='540' y='326' text-anchor='middle' font-size='19' font-weight='700' fill='#141413'>s(t) = 미 2년 금리 9/25 종가 − 9/22 종가 = +10.0bp</text><text x='540' y='350' text-anchor='middle' font-size='16.5' font-weight='400' fill='#5b5a55'>미국 거래일 3개 변화의 합. 한국은 9/24–9/25 휴장 (더미 hol = 1)</text><path d='M330,372 L330,360 L750,360 L750,372' fill='none' stroke='#141413' stroke-width='1.4'/><line x1='30' y1='436' x2='975' y2='436' stroke='#141413' stroke-width='1.5' marker-end='url(#ar)'/><rect x='40' y='376' width='210' height='60' rx='5' fill='#eef4fc' stroke='#2a78d6' stroke-width='1.2'/><text x='145' y='402' text-anchor='middle' font-size='19' font-weight='700' fill='#2a78d6'>한국 9/23(수)</text><text x='145' y='425' text-anchor='middle' font-size='16.5' font-weight='400' fill='#2a78d6'>종가</text><rect x='330' y='376' width='129.333' height='60' rx='5' fill='#fdf1eb' stroke='#eb6834' stroke-width='1.2'/><text x='394.667' y='402' text-anchor='middle' font-size='19' font-weight='700' fill='#eb6834'>9/23(수)</text><text x='394.667' y='425' text-anchor='middle' font-size='16.5' font-weight='400' fill='#eb6834'>미국 장</text><rect x='475.333' y='376' width='129.333' height='60' rx='5' fill='#fdf1eb' stroke='#eb6834' stroke-width='1.2'/><text x='540' y='402' text-anchor='middle' font-size='19' font-weight='700' fill='#eb6834'>9/24(목)</text><text x='540' y='425' text-anchor='middle' font-size='16.5' font-weight='400' fill='#eb6834'>미국 장</text><rect x='620.667' y='376' width='129.333' height='60' rx='5' fill='#fdf1eb' stroke='#eb6834' stroke-width='1.2'/><text x='685.333' y='402' text-anchor='middle' font-size='19' font-weight='700' fill='#eb6834'>9/25(금)</text><text x='685.333' y='425' text-anchor='middle' font-size='16.5' font-weight='400' fill='#eb6834'>미국 장</text><rect x='790' y='376' width='170' height='60' rx='5' fill='#eef4fc' stroke='#2a78d6' stroke-width='1.2'/><text x='875' y='402' text-anchor='middle' font-size='19' font-weight='700' fill='#2a78d6'>한국 9/28(월)</text><text x='875' y='425' text-anchor='middle' font-size='16.5' font-weight='400' fill='#2a78d6'>종가</text><path d='M145,444 L145,456 L875,456 L875,444' fill='none' stroke='#141413' stroke-width='1.4'/><text x='510' y='488' text-anchor='middle' font-size='19' font-weight='700' fill='#141413'>Δy(t+1) 국고채 3년 = +11.3bp (9/23 종가 → 9/28 종가)</text></svg>
